version: 0.2

env:
  variables:
    NODE_ENV: $NODE_ENV
    REDIRECT_URL: $REDIRECT_URL
    NEXT_PUBLIC_API: $NEXT_PUBLIC_API

phases:
  install:
      runtime-versions:
        nodejs: 20
      commands:
        - echo Installing Node Modules...

  pre_build:
    commands:
      - echo "REDIRECT_URL IS $REDIRECT_URL"
      - echo "NEXT_PUBLIC_API IS $NEXT_PUBLIC_API"
      - npm i

  build:
    commands:
      - npm run build

  post_build:
    commands:
      # - npm prune --production

artifacts:
  files:
    - '.next/**/*'
    - 'public/**/*'
    - 'node_modules/**/*'
    - '.env'
    - 'next.config.js'
    - 'server.js'
    - 'package.json'
    - 'package-lock.json'